[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcbe-addon-tester"
version = "0.1.0"
description = "Evidence-based Bedrock add-on testing with a local Windows AI control interface"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "nbtlib>=2.0.4,<3"]

[project.optional-dependencies]
ai = ["mcp>=1.12,<2"]
dev = ["ruff>=0.11,<1"]

[project.scripts]
mcbe-test = "mcbe_tester.cli:main"
mcbe-test-mcp = "mcbe_tester.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcbe_tester = ["assets/*.js"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
