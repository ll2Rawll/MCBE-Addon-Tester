name: Tester checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[ai,dev]"
      - run: python -m unittest discover -v
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Build wheel and verify observer is packaged
        shell: bash
        run: |
          python -m pip wheel . --no-deps -w dist
          python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert 'mcbe_tester/assets/observer.js' in z.namelist()"
